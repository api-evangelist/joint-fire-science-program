aid: joint-fire-science-program
name: Joint Fire Science Program
description: >-
  The Joint Fire Science Program (JFSP) funds scientific research on
  wildland fires and distributes results to help policymakers, fire
  managers and practitioners make sound decisions. Operated jointly by
  the U.S. Departments of the Interior and Agriculture, JFSP coordinates
  the Fire Science Exchange Network across regional knowledge nodes. JFSP
  does not publish a self-service developer portal or OpenAPI; research
  outputs are surfaced through the firescience.gov website.
